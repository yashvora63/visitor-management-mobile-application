name: visitor_management_app
description: "Visitor Management Mobile Application for real estate residential projects."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  sizer: ^3.1.3
  dropdown_button2: ^3.1.0
  flutter_easyloading: ^3.0.5

  # State Management & DI
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  get_it: ^8.0.3

  # Networking & REST API
  dio: ^5.11.1
  http: ^1.6.0

  # Storage & Utilities
  shared_preferences: ^2.5.2
  get_storage: ^2.1.1
  intl: ^0.20.2

  # Device & QR
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  mobx_codegen: ^2.3.0
  build_runner: ^2.15.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icon/icon.png
    - assets/lang/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
